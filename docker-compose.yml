services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drama_watchlist
    # Exposed on 5433 to avoid clashing with a local PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drama_watchlist"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: drama_watchlist
      JWT_SECRET: supersecretkey123
      JWT_EXPIRES_IN: 1h
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
